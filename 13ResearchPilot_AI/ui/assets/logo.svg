<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Filled background circle in flat green #10A37F -->
  <circle cx="64" cy="64" r="60" fill="#10A37F"/>
  
  <!-- Outer subtle ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.35"/>
  
  <!-- Compass Cardinal Ticks -->
  <line x1="64" y1="16" x2="64" y2="26" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="102" x2="64" y2="112" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="16" y1="64" x2="26" y2="64" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="102" y1="64" x2="112" y2="64" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Compass Needle (North-South) -->
  <polygon points="64,28 56,64 64,60 72,64" fill="#FFFFFF"/>
  <polygon points="64,100 56,64 64,68 72,64" fill="#FFFFFF" opacity="0.45"/>
  
  <!-- Magnifying Glass Circle -->
  <circle cx="72" cy="56" r="18" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <!-- Magnifying Glass Handle -->
  <line x1="85" y1="69" x2="100" y2="84" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Center Dot -->
  <circle cx="64" cy="64" r="4" fill="#FFFFFF"/>
</svg>
